name: Deploy backend to Hugging Face Space
# Pushes the backend/ folder to the Space on every change to main.
# One-time setup: repo secret HF_TOKEN (write token) and repo variable HF_SPACE (e.g. "yourname/resilient-ai-chat-api").
on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push backend/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" && test -n "$HF_SPACE"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git subtree split --prefix=backend -b hf-deploy
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf-deploy:main
